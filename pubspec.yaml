name: cupertino_fundations_models
description: "Apple Intelligence Foundation Models for Flutter: on-device AI, streaming, live speech-to-text, Private Cloud Compute, and hybrid routing to Gemini or ChatGPT."
version: 0.2.1
homepage: https://github.com/sooyvilla/cupertino_fundations_models
repository: https://github.com/sooyvilla/cupertino_fundations_models
issue_tracker: https://github.com/sooyvilla/cupertino_fundations_models/issues
documentation: https://github.com/sooyvilla/cupertino_fundations_models#readme
license: MIT
topics:
  - apple-intelligence
  - foundation-models
  - on-device-ai
  - ai
  - speech-to-text
platforms:
  ios:

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CupertinoFoundationModelsPlugin
