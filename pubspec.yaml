name: cupertino_fundations_models
description: "Apple Foundation Models for Flutter: on-device text, structured output, tools, streaming, Speech, and opt-in Private Cloud Compute."
version: 0.4.3
homepage: https://github.com/sooyvilla/cupertino_fundations_models
repository: https://github.com/sooyvilla/cupertino_fundations_models
issue_tracker: https://github.com/sooyvilla/cupertino_fundations_models/issues
documentation: https://pub.dev/documentation/cupertino_fundations_models/latest/
license: MIT
topics:
  - apple-intelligence
  - foundation-models
  - on-device-ai
  - ai
  - speech-to-text
platforms:
  ios:

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CupertinoFoundationModelsPlugin
