name: cupertino_fundations_models
description: "Use native Apple Foundation Models in Flutter iOS, iPadOS and macOS apps for on-device AI, structured JSON, streaming and tools. Includes speech-to-text. Local AI needs no API key."
version: 0.5.0
homepage: https://sooyvilla.github.io/cupertino_fundations_models/
repository: https://github.com/sooyvilla/cupertino_fundations_models
issue_tracker: https://github.com/sooyvilla/cupertino_fundations_models/issues
documentation: https://sooyvilla.github.io/cupertino_fundations_models/usage/
license: MIT
topics:
  - apple-intelligence
  - foundation-models
  - on-device-ai
  - ai
  - ios
platforms:
  ios:
  macos:

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CupertinoFoundationModelsPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: CupertinoFoundationModelsPlugin
        sharedDarwinSource: true
