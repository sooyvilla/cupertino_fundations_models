name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare shared documentation sources
        run: |
          mkdir -p doc/site/_includes/source doc/site/markdown/doc doc/site/markdown/example/lib
          for name in apple-platforms local-ai-ios README.es recipes faq choosing-local-ai usage document-extraction private-cloud-compute troubleshooting app-owned-routing migration-0.3.0 migration-0.4.0; do
            cp "doc/$name.md" "doc/site/_includes/source/$name.md"
            cp "doc/$name.md" "doc/site/markdown/doc/$name.md"
          done
          cp README.md CHANGELOG.md implementation_for_agents.md doc/site/_includes/source/
          cp README.md CHANGELOG.md implementation_for_agents.md doc/site/markdown/
          cp example/README.md example/pubspec.yaml doc/site/markdown/example/
          cp example/lib/main.dart example/lib/document_extraction.dart doc/site/markdown/example/lib/
          cp doc/ios-27-current-audit-2026-09-01.md doc/ios-27.2-audit-2026-09-19.md doc/site/markdown/doc/
      - name: Build documentation with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./doc/site
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout notification configuration
        uses: actions/checkout@v6
      - name: Notify IndexNow of published guides
        continue-on-error: true
        env:
          DOCUMENTATION_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          base = os.environ['DOCUMENTATION_URL'].rstrip('/') + '/'
          key = Path('doc/site/indexnow-key.txt').read_text().strip()
          key_url = base + 'indexnow-key.txt'
          with urllib.request.urlopen(key_url, timeout=20) as response:
              published_key = response.read().decode().strip()
          if published_key != key:
              raise RuntimeError('Published IndexNow verification file differs from this release.')
          with urllib.request.urlopen(base + 'sitemap.xml', timeout=20) as response:
              sitemap = ET.fromstring(response.read())
          urls = [element.text for element in sitemap.findall('{*}url/{*}loc')]
          if not urls or len(urls) > 10000 or any(not url.startswith(base) for url in urls):
              raise RuntimeError('Sitemap URLs must stay within this documentation site.')
          payload = {
              'host': urllib.parse.urlparse(base).hostname,
              'key': key,
              'keyLocation': key_url,
              'urlList': urls,
          }
          request = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json; charset=utf-8'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f'IndexNow received {len(urls)} URLs: HTTP {response.status}.')
              print('Receipt does not confirm indexing or search position.')
          PY
