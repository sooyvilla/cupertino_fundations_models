name: Publish to pub.dev

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests and 100% Dart coverage
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd packages/cupertino_fundations_models_generator && flutter pub get)
          (cd example && flutter pub get)
      - name: Analyze Dart sources
        run: flutter analyze --no-pub
      - name: Test release and coverage guards
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Test optional Dart generator and require full coverage
        working-directory: packages/cupertino_fundations_models_generator
        run: |
          dart test --coverage coverage --reporter expanded
          dart run coverage:format_coverage --lcov --in coverage --out coverage/lcov.info --report-on lib
          python3 ../../.github/scripts/check_coverage.py
      - name: Generate optional example companions
        working-directory: example
        run: dart run build_runner build
      - name: Run Flutter tests
        run: flutter test --coverage --reporter expanded
      - name: Require complete Dart line coverage
        run: python3 .github/scripts/check_coverage.py
      - name: Save coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  apple-builds:
    name: Native contract tests and Apple examples
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Report Apple SDK and runtime versions
        run: |
          xcodebuild -version
          sw_vers
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve example and generator dependencies
        run: |
          flutter pub get
          (cd packages/cupertino_fundations_models_generator && flutter pub get)
          (cd example && flutter pub get)
      - name: Test production native helper contracts
        run: swift test --package-path darwin --enable-code-coverage
      - name: Save native coverage report
        if: ${{ !cancelled() && hashFiles('darwin/.build/**/codecov/*.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-coverage
          path: darwin/.build/**/codecov/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Validate native helper coverage against runtime availability
        run: python3 .github/scripts/check_schema_coverage.py --respect-runtime-availability
      - name: Compile iOS without signing
        working-directory: example
        run: flutter build ios --release --no-codesign
      - name: Compile macOS
        working-directory: example
        run: flutter build macos --debug

  prepare:
    name: Check release version
    needs: [verify, apple-builds]
    if: github.event_name == 'push' && github.repository == 'sooyvilla/cupertino_fundations_models' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to release
        id: release
        run: python3 .github/scripts/pubdev_release.py
      - name: Create release token
        if: steps.release.outputs.create_tag == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBDEV_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBDEV_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cupertino_fundations_models
          permission-contents: write
      - name: Create version tag
        if: steps.release.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh auth setup-git --hostname github.com
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          printf 'Created `%s` for `%s`. Its tag workflow publishes the package.\n' \
            "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish new version
    needs: [verify, apple-builds, prepare]
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pubdev-publish-${{ github.ref_name }}
      cancel-in-progress: false
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
